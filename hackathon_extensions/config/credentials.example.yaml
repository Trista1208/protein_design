# ==============================================================================
# Enzyme Design Hackathon 2026 - Backend Credentials Template
# ==============================================================================
# Copy this file to `hackathon_extensions/config/credentials.yaml`
# OR create a personal profile in `hackathon_extensions/config/user_profiles/<username>.yaml`
#
# DO NOT commit real API keys or private keys to git!
# ==============================================================================

# Tamarind Bio REST API Key
# Needed for RFD4-Proteina diffusion and Boltz-2 / AF3 all-atom co-folding
tamarind_api_key: "tam_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Modal AI Serverless Cloud Tokens
# Needed for serverless high-VRAM execution (PLACER 100-sample ensembles, ESM3, SaProt)
modal_token_id: "ak-xxxxxxxxxxxxxxxxxxxx"
modal_token_secret: "as-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ETH Zurich Euler Cluster (RTX 2080 - 8GB VRAM)
# Used for LigandMPNN sequence design, ThermoMPNN, OpenMM MD, FieldTools, and ORCA QM/MM
eth_euler_host: "euler.ethz.ch"
eth_euler_user: "your_ethz_username"
eth_euler_port: 22
eth_euler_key_filename: "~/.ssh/id_rsa_euler"
# eth_euler_password: "your_password_if_not_using_ssh_key"
eth_euler_slurm_partition: "gpu.2080"
eth_euler_scratch_dir: "/cluster/scratch/your_ethz_username"
